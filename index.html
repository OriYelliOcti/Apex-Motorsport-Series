<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velocity Motorsport Series | The Next Generation</title>
    
    <!-- Link to external fonts and styles -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Space+Grotesk:wght=500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <!-- Load Supabase Core Infrastructure (deferred to prevent lag) -->
    <script src="https://jsdelivr.net" defer></script>
    <!-- Load your custom application script -->
    <script src="app.js" defer></script>
</head>
<body>

    <!-- Main Navigation Header -->
    <header>
        <div class="logo">VMS<span>.</span></div>
        <button class="admin-trigger" id="adminBtn">Admin Panel</button>
    </header>

    <!-- Public Viewport -->
    <main>
        <section class="hero">
            <h1>Built for Speed.<br>Driven by <span>Passion.</span></h1>
            <p>We are more than telemetry and lap times. VMS is the heartbeat of a community shaping the champions of tomorrow.</p>
        </section>

        <section class="series-section">
            <h2 class="section-title">Active Championships</h2>
            <div class="series-container" id="championships-list">
                <p class="loading-status">Connecting to track network...</p>
            </div>
        </section>
    </main>

    <!-- Administrative Configuration Overlay -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <h2>Add New Racing Series</h2>
            <form id="db-control-form">
                <div class="form-group">
                    <label>Championship Code Name</label>
                    <input type="text" id="seriesCode" placeholder="e.g., VMS F1" required>
                </div>
                <div class="form-group">
                    <label>Tier Category</label>
                    <input type="text" id="seriesTier" placeholder="e.g., Pinnacle Series" required>
                </div>
                <div class="form-group">
                    <label>Driver Slots Available</label>
                    <input type="number" id="seriesDrivers" placeholder="e.g., 20" required>
                </div>
                <button type="submit" class="submit-btn">Publish to Live Database</button>
                <button type="button" id="closeAdminBtn" class="cancel-btn">Cancel Operation</button>
            </form>
        </div>
    </div>

</body>
</html>
