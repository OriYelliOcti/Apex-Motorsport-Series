            <section id="schedule" class="dashboard-section">
                <div class="section-header">
                    <h3 class="section-heading">RACE CALENDAR</h3>
                    <div class="series-filter">
                        <button class="filter-node active" data-series="all">ALL</button>
                        <button class="filter-node" data-series="Formula 1">FORMULA 1</button>
                        <button class="filter-node" data-series="Formula 2">FORMULA 2</button>
                        <button class="filter-node" data-series="Formula 3">FORMULA 3</button>
                        <button class="filter-node" data-series="GT3">GT3</button>
                    </div>
                </div>
                <div id="races-list" class="dashboard-grid">
                    <div class="loading">Loading calendar array...</div>
                </div>
            </section>

            <section id="standings" class="dashboard-section">
                <div class="section-header">
                    <h3 class="section-heading">CHAMPIONSHIP BATTLES</h3>
                </div>
                <div id="standings-list" class="battles-container">
                    <div class="loading">Syncing standings matrix...</div>
                </div>
            </section>

            <section id="lineups" class="dashboard-section">
                <div class="section-header">
                    <h3 class="section-heading">OFFICIAL LINEUPS</h3>
                </div>
                <div id="lineups-list" class="lineups-teams-wrapper">
                    <div class="loading">Fetching team rosters from matrix...</div>
                </div>
            </section>

            <section id="admin-trigger" class="dashboard-section admin-section hidden">
                <div class="section-header">
                    <h3 class="section-heading">PORTAL LOG IN</h3>
                </div>
                <div class="portal-container">
                    <!-- REPARIERT: Kein vordefinierter Standardwert mehr bei der Mail -->
                    <form id="login-form" class="portal-form">
                        <div class="form-group">
                            <label>ACCOUNT EMAIL</label>
                            <input type="email" id="admin-email" required placeholder="operator@apex.com">
                        </div>
                        <div class="form-group">
                            <label>ACCOUNT PASSWORD</label>
                            <input type="password" id="admin-password" required placeholder="••••••••">
                        </div>
                        <button type="submit" class="btn-portal-submit">LOG IN</button>
                    </form>
                </div>

                <div id="admin-dashboard" class="hidden">
                    <div class="dashboard-control-bar">
                        <span>CONTROL INTERFACE ACTIVE</span>
                        <button id="logout-btn" class="btn-logout-portal">LOG OUT</button>
                    </div>
                    <form id="race-form" class="portal-form" style="margin-top: 20px;">
                        <div class="form-group">
                            <label>Series Tier</label>
                            <select id="race-series">
                                <option value="Formula 1">Formula 1</option>
                                <option value="Formula 2">Formula 2</option>
                                <option value="Formula 3">Formula 3</option>
                                <option value="GT3">GT3</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Circuit / Track</label>
                            <input type="text" id="race-track" required placeholder="e.g. Monza Circuit">
                        </div>
                        <div class="form-group">
                            <label>Country</label>
                            <input type="text" id="race-country" required placeholder="e.g. Italy">
                        </div>
                        <div class="form-group">
                            <label>Race Timestamp</label>
                            <input type="datetime-local" id="race-date" required>
                        </div>
                        <button type="submit" class="btn-portal-submit red-btn">PUBLISH TO MATRIX</button>
                    </form>
                </div>
            </section>
        </main>

        <footer>
            <div class="footer-wrap">
                <div>&copy; 2026 APEX MOTORSPORT SERIES.</div>
                <div class="footer-version">v3.6 // NET_GROOVE ENGINE</div>
            </div>
        </footer>
    </div>

    <script src="https://unpkg.com"></script>
    <script src="app.js"></script>
</body>
</html>
